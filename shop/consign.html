<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>寄賣上架</title>
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --sunk:#E2E6EC; --ink:#151A22; --muted:#5D6675; --line:#D3D8E0;
  --accent:#2747D8; --accent-ink:#FFFFFF; --ok:#1E8A55; --warn:#B87400; --sold:#C2333A;
  --f-display:"Barlow Condensed","Noto Sans TC","Arial Narrow",sans-serif;
  --f-body:"Noto Sans TC",system-ui,-apple-system,"Microsoft JhengHei",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#12151B; --surface:#1B2029; --sunk:#232935; --ink:#E8ECF2; --muted:#9AA3B2; --line:#2E3543;
  --accent:#7D93FF; --accent-ink:#0E1220; --ok:#4CC88A; --warn:#E6A93A; --sold:#F06A70; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding:20px max(16px,env(safe-area-inset-left,0px)) 60px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(30px,6vw,40px);line-height:1;margin:0}
.notice{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13.5px;color:var(--muted)}
.notice b{color:var(--ink)}
.form{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.sec{font-weight:700;font-size:14px;margin-top:4px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:13px;color:var(--muted)}
.field label .req{color:var(--sold)}
input,select,textarea{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:9px 11px;min-height:42px;width:100%;min-width:0}
textarea{min-height:76px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media (max-width:420px){.row3{grid-template-columns:1fr 1fr}}
.photo{display:flex;gap:12px;align-items:center}
.slot{width:110px;aspect-ratio:63/88;border-radius:10px;border:1px dashed var(--line);background:var(--sunk);display:grid;place-items:center;overflow:hidden;flex:none;color:var(--muted);font-size:12px;text-align:center}
.slot img{width:100%;height:100%;object-fit:contain;display:block;background:var(--sunk)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;min-height:42px;font-weight:500}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn:disabled{opacity:.55;cursor:default}
.note{font-size:12.5px;color:var(--muted)}
.err{color:var(--sold);font-size:13.5px}
.done{background:color-mix(in srgb,var(--ok) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--ok) 45%,var(--line));border-radius:12px;padding:14px}
a{color:var(--accent)}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <h1>寄賣上架</h1>
  <div class="notice">
    <b>這個網頁是公開的，知道連結的人都能打開。</b><br>
    你送出的卡片要等賣家核准後，才會出現在<a href="./" id="shopLink">卡櫃買家頁</a>；買家頁也是知道連結的人都看得到，內容包含照片、售價、上架者名稱和聯絡方式。<br>
    買家會直接聯絡你交易，付款與出貨由你們雙方自行確認，本店不經手。資料送出後第 8 天自動刪除。
  </div>

  <form class="form" id="f" autocomplete="off" novalidate>
    <div class="sec">卡片照片</div>
    <div class="photo">
      <div class="slot" id="prev">還沒選照片</div>
      <div class="field" style="flex:1">
        <label for="photo">卡片正面一張 <span class="req">*</span></label>
        <input id="photo" type="file" accept="image/*">
        <div class="note" id="photoInfo">會自動壓縮到約 300KB 再上傳</div>
      </div>
    </div>

    <div class="sec">卡片資料</div>
    <div class="field"><label for="name">卡片名稱 <span class="req">*</span></label><input id="name" placeholder="例如：2026 Topps Chrome Lando Norris Refractor"></div>
    <div class="row3">
      <div class="field"><label for="sport">運動類型</label><select id="sport"><option>F1</option><option>棒球</option><option>籃球</option><option>其他</option></select></div>
      <div class="field"><label for="year">年份</label><input id="year" type="number" inputmode="numeric" placeholder="2026"></div>
      <div class="field"><label for="no">卡號</label><input id="no" placeholder="001、HS-1"></div>
    </div>
    <div class="row2">
      <div class="field"><label for="series">系列</label><input id="series" placeholder="Topps Chrome"></div>
      <div class="field"><label for="kind">種類</label><input id="kind" placeholder="driver、插卡名稱"></div>
    </div>
    <div class="row2">
      <div class="field"><label for="price">售價（NT$） <span class="req">*</span></label><input id="price" type="number" min="0" inputmode="numeric"></div>
      <div class="field"><label for="qty">數量</label><input id="qty" type="number" min="1" value="1" inputmode="numeric"></div>
    </div>
    <div class="field"><label for="note">備註</label><textarea id="note" placeholder="卡況、平行版編號、面交地點等"></textarea></div>

    <div class="sec">你的聯絡資料（買家會看到）</div>
    <div class="row2">
      <div class="field"><label for="seller">上架者名稱 <span class="req">*</span></label><input id="seller" placeholder="FB 名稱或暱稱"></div>
      <div class="field"><label for="contact">聯絡方式 <span class="req">*</span></label><input id="contact" placeholder="FB 個人頁連結或 LINE ID"></div>
    </div>

    <div class="err" id="err" hidden></div>
    <button class="btn primary" id="go" type="submit">送出，等待核准</button>
  </form>

  <div class="done" id="done" hidden>
    <b>已送出！</b> 賣家核准後就會出現在買家頁。<br>
    <button class="btn" id="again" style="margin-top:10px">再上架一張</button>
  </div>
</div>

<script>
(function () {
  var API = (window.SHOP_CONFIG && window.SHOP_CONFIG.api) || "";
  var $ = function (id) { return document.getElementById(id); };
  var photo = "";
  var CLIENT = (function () { try { var v = localStorage.getItem("cardshop.client"); if (!v) { v = Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem("cardshop.client", v); } return v; } catch (e) { return ""; } })();
  // 記住上架者和聯絡方式，下次不用重打
  try { var me = JSON.parse(localStorage.getItem("cardshop.seller") || "{}"); $("seller").value = me.seller || ""; $("contact").value = me.contact || ""; $("sport").value = me.sport || "F1"; } catch (e) {}

  // 照片壓縮：最長邊先縮到 1600px，JPEG 品質逐步降低；還太大就再縮小尺寸，直到約 300KB 以下
  var TARGET = 300 * 1024;
  var bytes = function (dataUrl) { return Math.round((dataUrl.length - dataUrl.indexOf(",") - 1) * 3 / 4); };
  function loadImg(file) {
    return new Promise(function (ok, bad) {
      var u = URL.createObjectURL(file), im = new Image();
      im.onload = function () { ok(im); URL.revokeObjectURL(u); };
      im.onerror = function () { bad(new Error("讀不到這張照片，請換一張（建議 JPG）")); URL.revokeObjectURL(u); };
      im.src = u;
    });
  }
  async function compress(file) {
    var im = await loadImg(file);
    var side = Math.min(1600, Math.max(im.naturalWidth, im.naturalHeight)), out = "";
    for (var round = 0; round < 6; round++) {
      var k = side / Math.max(im.naturalWidth, im.naturalHeight);
      var c = document.createElement("canvas");
      c.width = Math.max(1, Math.round(im.naturalWidth * k)); c.height = Math.max(1, Math.round(im.naturalHeight * k));
      var g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.drawImage(im, 0, 0, c.width, c.height);
      var qs = [0.85, 0.75, 0.65, 0.55];
      for (var i = 0; i < qs.length; i++) { out = c.toDataURL("image/jpeg", qs[i]); if (bytes(out) <= TARGET) return { url: out, w: c.width, h: c.height }; }
      side = Math.round(side * 0.8);
    }
    return { url: out, w: 0, h: 0 };
  }
  $("photo").onchange = async function () {
    var f = this.files[0]; photo = ""; if (!f) return;
    $("photoInfo").textContent = "壓縮中…";
    try {
      var r = await compress(f);
      photo = r.url;
      $("prev").innerHTML = '<img alt="卡片照片預覽" src="' + photo + '">';
      $("photoInfo").textContent = "原檔 " + Math.round(f.size / 1024) + "KB → 上傳 " + Math.round(bytes(photo) / 1024) + "KB" + (r.w ? "（" + r.w + "×" + r.h + "）" : "");
    } catch (e) { $("photoInfo").textContent = e.message; }
  };

  function showErr(m) { $("err").textContent = m; $("err").hidden = !m; }
  $("f").onsubmit = function (e) {
    e.preventDefault(); showErr("");
    var v = function (id) { return $(id).value.trim(); };
    if (!photo) return showErr("請選一張卡片照片");
    if (!v("name")) return showErr("請填卡片名稱");
    if (v("price") === "" || Number(v("price")) < 0) return showErr("請填售價");
    if (!v("seller") || !v("contact")) return showErr("請填上架者名稱和聯絡方式，買家才找得到你");
    if (!API) return showErr("網站還沒設定完成，請聯絡賣家");
    var body = { action: "consign", client: CLIENT, photo: photo, name: v("name"), sport: v("sport"), year: v("year"), no: v("no"), series: v("series"),
      kind: v("kind"), price: v("price"), qty: v("qty") || 1, note: v("note"), seller: v("seller"), contact: v("contact") };
    try { localStorage.setItem("cardshop.seller", JSON.stringify({ seller: body.seller, contact: body.contact, sport: body.sport })); } catch (e) {}
    var b = $("go"); b.disabled = true; b.textContent = "上傳中…";
    fetch(API, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body) })
      .then(function (r) { if (!r.ok) throw new Error(); return r.json(); })
      .then(function (r) {
        b.disabled = false; b.textContent = "送出，等待核准";
        if (!r.ok) return showErr(r.message || "送出失敗，請再試一次");
        $("f").hidden = true; $("done").hidden = false; window.scrollTo(0, 0);
      })
      .catch(function () { b.disabled = false; b.textContent = "送出，等待核准"; showErr("連不上伺服器，請檢查網路後再試一次"); });
  };
  $("again").onclick = function () {
    ["name", "year", "no", "series", "kind", "price", "note"].forEach(function (id) { $(id).value = ""; });
    $("qty").value = 1; $("photo").value = ""; photo = ""; $("prev").textContent = "還沒選照片"; $("photoInfo").textContent = "會自動壓縮到約 300KB 再上傳";
    $("done").hidden = true; $("f").hidden = false;
  };
})();
</script>
</body>
</html>
